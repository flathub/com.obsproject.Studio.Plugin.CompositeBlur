id: com.obsproject.Studio.Plugin.CompositeBlur
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.freedesktop.Sdk//26.08
build-extension: true
separate-locales: false
build-options:
  prefix: /app/plugins/CompositeBlur
modules:
  - name: composite-blur
    buildsystem: cmake-ninja
    builddir: true
    no-make-install: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
    build-commands:
      - cmake --install . --component Modern
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ${FLATPAK_BUILDER_BUILDDIR}/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/FiniteSingularity/obs-composite-blur.git
        tag: v1.6.1
        commit: 8483ccbf51ef633b59341904be02497a9b07dcef
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^v([\d.]+)
      - type: file
        path: com.obsproject.Studio.Plugin.CompositeBlur.metainfo.xml
